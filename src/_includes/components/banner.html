{% set bannerSrc = "/assets/images/" + bannerImg + ".jpg" %}
<section id="nbc-split" class="nbc-split-page">
    <div class="nbc-split-content">
        <nav class="nbc-crumbs" aria-label="breadcrumb">
            <a href="/">Home</a>
            <span aria-current="page">{{ bannerTitle }}</span>
        </nav>
        <span class="cs-topper">{{ bannerTopper }}</span>
        <h1 class="cs-title">{{ bannerTitle }}</h1>
        <p class="cs-text">{{ bannerText }}</p>
        {% if bannerButton %}<div class="nbc-buttons" style="margin-top:2rem"><a href="{{ bannerButtonLink }}" class="cs-button-solid"{% if "http" in bannerButtonLink %} target="_blank" rel="noopener"{% endif %}>{{ bannerButton }}</a></div>{% endif %}
    </div>
    <picture class="nbc-split-photo">
        <source media="(max-width: 600px)" srcset="{% getUrl bannerSrc | resize({ width: 800, height: 600 }) | webp %}" type="image/webp">
        <source media="(min-width: 601px)" srcset="{% getUrl bannerSrc | resize({ width: 1400, height: 1000 }) | webp %}" type="image/webp">
        <img src="{% getUrl bannerSrc | resize({ width: 1400, height: 1000 }) | jpeg %}" alt="" width="700" height="500" loading="eager" decoding="async">
    </picture>
</section>
