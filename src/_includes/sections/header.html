<!-- ============================================ -->
<!--                 Navigation                   -->
<!-- ============================================ -->

<header id="cs-navigation">
    <div class="nbc-topbar">
        <div class="nbc-topbar-inner">
            <ul class="nbc-topbar-info">
                <li>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
                    <a href="tel:{{ client.phoneForTel }}">{{ client.phoneFormatted }}</a>
                </li>
                <li>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                    <span>Sun 11:00 AM · Wed 6:00 PM</span>
                </li>
                <li>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    <a href="{{ client.address.mapLink }}" target="_blank" rel="noopener">{{ client.address.lineOne }}, {{ client.address.city }}</a>
                </li>
            </ul>
            <div class="nbc-topbar-social">
                <a href="{{ client.socials.facebook }}" target="_blank" rel="noopener" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="nbc-fill"><path d="M14 8h3V4h-3c-2.8 0-4 1.7-4 4.3V10H7v4h3v8h4v-8h3l1-4h-4V8.6c0-.4.3-.6.6-.6z"/></svg>
                </a>
                <a href="{{ client.socials.youtube }}" target="_blank" rel="noopener" aria-label="YouTube">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="nbc-fill"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 5 12 5 12 5s-7 0-8.9.4A3 3 0 0 0 1 7.5 31 31 0 0 0 .6 12c0 1.5.1 3 .4 4.5a3 3 0 0 0 2.1 2.1C5 19 12 19 12 19s7 0 8.9-.4a3 3 0 0 0 2.1-2.1c.3-1.5.4-3 .4-4.5s-.1-3-.4-4.5zM9.8 15V9l5.2 3z"/></svg>
                </a>
            </div>
        </div>
    </div>
    <div class="cs-container">
        <a href="/" class="cs-logo nbc-logo" aria-label="New Beginnings in Christ home page">
            <img src="/assets/images/logo-crest.png" alt="" width="64" height="65" aria-hidden="true" decoding="async">
            <span class="nbc-logo-text">New Beginnings<small>in Christ · Laurens, SC</small></span>
        </a>
        <!--Navigation List-->
        <nav class="cs-nav" aria-label="main navigation">
            <!--Mobile Nav Toggle-->
            <button class="cs-toggle" id="cs-toggle" aria-expanded="false" aria-controls="cs-ul-wrapper" aria-label="mobile menu toggle" aria-haspopup="menu">
                <span class="cs-box" aria-hidden="true">
                    <span class="cs-line cs-line1" aria-hidden="true"></span>
                    <span class="cs-line cs-line2" aria-hidden="true"></span>
                    <span class="cs-line cs-line3" aria-hidden="true"></span>
                </span>
            </button>
            <!-- We need a wrapper div so we can set a fixed height on the cs-ul in case the nav list gets too long from too many dropdowns being opened and needs to have an overflow scroll. This wrapper acts as the background so it can go the full height of the screen and not cut off any overflowing nav items while the cs-ul stops short of the bottom of the screen, which keeps all nav items in view no matter how many there are-->
            <div class="cs-ul-wrapper" id="cs-ul-wrapper" inert>
                <ul id="cs-expanded" class="cs-ul">
                    <li class="cs-li">
                        <a href="/" class="cs-li-link {% if page.url == "/" %} cs-active {% endif %}" {% if page.url == "/" %} aria-current="page" {% endif %}>
                            Home
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/about/" class="cs-li-link {% if page.url == "/about/" %} cs-active {% endif %}" {% if page.url == "/about/" %} aria-current="page" {% endif %}>
                            About
                        </a>
                    </li>
                    <li class="cs-li cs-dropdown">
                        <button class="cs-li-link cs-dropdown-toggle {% if page.url == "/visit/" or page.url == "/watch/" %} cs-active {% endif %}" aria-haspopup="menu" aria-expanded="false" id="visit-dropdown-toggle">
                            Visit
                            <img class="cs-drop-icon" src="/assets/svgs/dropdown.svg" alt="" width="15" height="15" decoding="async" aria-hidden="true">
                        </button>
                        <ul class="cs-drop-ul" aria-labelledby="visit-dropdown-toggle">
                            <li class="cs-drop-li">
                                <a href="/visit/" class="cs-li-link cs-drop-link">Plan a Visit</a>
                            </li>
                            <li class="cs-drop-li">
                                <a href="/watch/" class="cs-li-link cs-drop-link">Watch Online</a>
                            </li>
                        </ul>
                    </li>
                    <li class="cs-li">
                        <a href="/give/" class="cs-li-link {% if page.url == "/give/" %} cs-active {% endif %}" {% if page.url == "/give/" %} aria-current="page" {% endif %}>
                            Give
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/contact/" class="cs-li-link {% if page.url == "/contact/" %} cs-active {% endif %}" {% if page.url == "/contact/" %} aria-current="page" {% endif %}>
                            Contact
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <a href="/visit/" class="cs-button-solid cs-nav-button">Join Us Sunday</a>
    </div>
</header>
